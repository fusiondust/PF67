<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <title>{% block title %}PF67{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            padding-top: 0;
            padding-bottom: 30px;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        .pf67-status {
            font-weight: 600;
        }

        .pf67-card {
            margin-bottom: 16px;
        }

        .pf67-small {
            font-size: 0.9rem;
        }

        .pf67-muted-link {
            color: var(--bs-secondary-color);
            text-decoration: none;
        }

        .pf67-muted-link:hover {
            color: var(--bs-link-color);
            text-decoration: underline;
        }

        .pf67-inline-select {
            border: 0;
            border-bottom: 1px solid var(--bs-border-color);
            border-radius: 0;
            background: transparent;
            color: var(--bs-body-color);
            padding: 0 1.4rem 0 0;
            width: auto;
            min-width: 110px;
            box-shadow: none;
            display: inline-block;
        }

        .pf67-inline-select:focus {
            outline: 0;
            box-shadow: none;
            border-bottom-color: var(--bs-link-color);
        }

        .pf67-header-actions {
            white-space: nowrap;
        }

        .pf67-context-menu {
            position: fixed;
            z-index: 2500;
            min-width: 170px;
            display: none;
            background: var(--bs-body-bg);
            color: var(--bs-body-color);
            border: 1px solid var(--bs-border-color);
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
            padding: 4px;
        }

        .pf67-context-menu button {
            display: block;
            width: 100%;
            border: 0;
            background: transparent;
            color: var(--bs-body-color);
            text-align: left;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .pf67-context-menu button:hover {
            background: rgba(108, 117, 125, 0.18);
        }

        .pf67-context-menu button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        textarea {
            min-height: 100px;
        }

        .pf67-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            text-align: center;
            padding: 2px 0;
            font-size: 0.72rem;
            line-height: 1.25;
            opacity: 0.72;
            background: var(--bs-body-bg);
            border-top: 1px solid var(--bs-border-color);
            z-index: 1020;
        }

        .pf67-dashboard-list {
            min-height: 280px;
        }

        .pf67-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .pf67-board-column {
            min-height: 180px;
        }

        .pf67-board-item {
            border-left: 4px solid rgba(13, 110, 253, 0.72);
        }

        .pf67-step-list {
            max-height: 75vh;
            overflow: auto;
        }

        .pf67-step-button {
            text-align: left;
            white-space: normal;
            position: relative;
            overflow: hidden;
            padding-right: 72px;
        }

        .pf67-step-title {
            display: block;
            font-weight: 600;
            line-height: 1.2;
        }

        .pf67-step-context-watermark {
            position: absolute;
            right: 10px;
            bottom: 6px;
            opacity: 0.14;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            pointer-events: none;
            text-transform: uppercase;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pf67-step-time {
            display: block;
            font-size: 0.78rem;
            opacity: 0.82;
        }

        .pf67-timing-box {
            display: inline-flex;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 0;
            max-width: 100%;
            border: 1px solid var(--bs-border-color);
            border-radius: 10px;
            overflow: hidden;
            background: rgba(108, 117, 125, 0.08);
        }

        .pf67-timing-status {
            display: flex;
            align-items: center;
            padding: 7px 10px;
            font-size: 0.95rem;
            font-weight: 700;
            background: rgba(108, 117, 125, 0.16);
            border-right: 1px solid var(--bs-border-color);
        }

        .pf67-timing-row {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
        }

        .pf67-timing-cell {
            padding: 7px 9px;
            border-right: 1px solid rgba(108, 117, 125, 0.18);
            min-width: 82px;
        }

        .pf67-timing-cell:last-child {
            border-right: 0;
        }

        .pf67-timing-label {
            font-size: 0.68rem;
            color: var(--bs-secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-right: 4px;
        }

        .pf67-timing-value {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .pf67-time-ready {
            background: rgba(13, 110, 253, 0.08);
        }

        .pf67-time-ideal {
            background: rgba(25, 135, 84, 0.14);
        }

        .pf67-time-limit {
            background: rgba(255, 193, 7, 0.22);
        }

        .pf67-time-risk {
            background: rgba(253, 126, 20, 0.28);
        }

        .pf67-time-failure {
            background: rgba(220, 53, 69, 0.38);
        }

        .pf67-time-completed {
            background: rgba(25, 135, 84, 0.24);
        }

        .pf67-time-editor-row {
            display: flex;
            justify-content: flex-end;
        }

        .pf67-time-editor {
            width: 33.333%;
            min-width: 230px;
        }

        .pf67-timeline {
            max-height: 80vh;
            overflow: auto;
        }

        .pf67-timeline-item {
            position: relative;
            border-left-width: 5px;
            border-left-style: solid;
            overflow: hidden;
        }

        .pf67-timeline-item-active {
            background-color: rgba(108, 117, 125, 0.32);
        }

        .pf67-timeline-job {
            border-left-color: rgba(13, 110, 253, 0.65);
        }

        .pf67-timeline-status {
            border-left-color: rgba(255, 193, 7, 0.8);
        }

        .pf67-timeline-job-note {
            border-left-color: rgba(13, 202, 240, 0.72);
        }

        .pf67-timeline-completed {
            border-left-color: rgba(25, 135, 84, 0.72);
        }

        .pf67-timeline-note {
            border-left-color: rgba(111, 66, 193, 0.72);
        }

        .pf67-timeline-completion-note {
            border-left-color: rgba(32, 201, 151, 0.72);
        }

        .pf67-timeline-critical {
            border-left-color: rgba(220, 53, 69, 0.78);
        }

        .pf67-timeline-default {
            border-left-color: rgba(108, 117, 125, 0.7);
        }

        .pf67-timeline-watermark {
            position: absolute;
            top: 8px;
            right: 10px;
            opacity: 0.12;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            pointer-events: none;
            text-transform: uppercase;
            max-width: 76px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pf67-timeline-title {
            padding-right: 76px;
            font-weight: 600;
        }

        .pf67-timeline-preview {
            color: var(--bs-secondary-color);
            font-size: 0.86rem;
        }

        .pf67-timeline-thumb {
            width: 96px;
            height: 64px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--bs-border-color);
            margin-top: 8px;
        }

        .pf67-media-thumb {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--bs-border-color);
            cursor: pointer;
        }

        .pf67-note-full img,
        .pf67-step-note-body img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--bs-border-color);
            margin-top: 8px;
        }

        .pf67-step-note-card {
            border-left: 4px solid rgba(111, 66, 193, 0.6);
        }

        .pf67-inline-note-editor {
            border-left: 4px solid rgba(13, 110, 253, 0.75);
            background: rgba(108, 117, 125, 0.06);
        }

        .pf67-template-meta-grid {
            display: grid;
            grid-template-columns: minmax(220px, 2fr) minmax(130px, 0.8fr) minmax(160px, 1fr);
            gap: 10px;
            align-items: end;
        }

        .pf67-template-timing-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(160px, 1fr));
            gap: 10px;
        }

        .pf67-template-time-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .pf67-job-dot {
            display: inline-block;
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            margin-right: 0.35rem;
            vertical-align: middle;
        }

        .pf67-job-color-1 {
            --pf67-job-color: rgba(13, 110, 253, 0.95);
            border-left-color: rgba(13, 110, 253, 0.95) !important;
        }

        .pf67-job-color-2 {
            --pf67-job-color: rgba(111, 66, 193, 0.95);
            border-left-color: rgba(111, 66, 193, 0.95) !important;
        }

        .pf67-job-color-3 {
            --pf67-job-color: rgba(214, 51, 132, 0.95);
            border-left-color: rgba(214, 51, 132, 0.95) !important;
        }

        .pf67-job-color-4 {
            --pf67-job-color: rgba(253, 126, 20, 0.95);
            border-left-color: rgba(253, 126, 20, 0.95) !important;
        }

        .pf67-job-color-5 {
            --pf67-job-color: rgba(32, 201, 151, 0.95);
            border-left-color: rgba(32, 201, 151, 0.95) !important;
        }

        .pf67-job-color-6 {
            --pf67-job-color: rgba(102, 16, 242, 0.95);
            border-left-color: rgba(102, 16, 242, 0.95) !important;
        }

        .pf67-job-dot.pf67-job-color-1,
        .pf67-job-dot.pf67-job-color-2,
        .pf67-job-dot.pf67-job-color-3,
        .pf67-job-dot.pf67-job-color-4,
        .pf67-job-dot.pf67-job-color-5,
        .pf67-job-dot.pf67-job-color-6 {
            background: var(--pf67-job-color);
        }

        .fc-event {
            border-left-width: 5px !important;
        }

        .pf67-cal-completed {
            background-color: rgba(25, 135, 84, 0.9) !important;
            border-color: rgba(25, 135, 84, 0.9) !important;
        }

        .pf67-cal-waiting {
            background-color: rgba(108, 117, 125, 0.9) !important;
            border-color: rgba(108, 117, 125, 0.9) !important;
        }

        .pf67-cal-checkable,
        .pf67-cal-ideal {
            background-color: rgba(13, 110, 253, 0.9) !important;
            border-color: rgba(13, 110, 253, 0.9) !important;
        }

        .pf67-cal-late,
        .pf67-cal-risky {
            background-color: rgba(255, 193, 7, 0.95) !important;
            border-color: rgba(255, 193, 7, 0.95) !important;
            color: #111 !important;
        }

        .pf67-cal-critical {
            background-color: rgba(220, 53, 69, 0.95) !important;
            border-color: rgba(220, 53, 69, 0.95) !important;
        }

        @media (max-width: 768px) {
            .pf67-timing-box {
                display: flex;
            }

            .pf67-timing-status {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid var(--bs-border-color);
            }

            .pf67-timing-cell {
                min-width: 50%;
            }

            .pf67-time-editor {
                width: 100%;
            }

            .pf67-template-meta-grid,
            .pf67-template-timing-grid {
                grid-template-columns: 1fr;
            }
        }
    
        .pf67-inline-edit-buttons {
            display: inline-flex;
            gap: 4px;
            vertical-align: middle;
        }

        .pf67-inline-edit-button {
            width: 34px;
            height: 34px;
            padding: 0;
            line-height: 1;
            text-align: center;
            font-weight: 800;
            border-radius: 6px;
        }

        .pf67-inline-date-editor {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pf67-inline-date-editor input[type="datetime-local"] {
            width: 210px;
            max-width: 60vw;
        }

        .pf67-timeline-watermark,
        .pf67-step-context-watermark {
            opacity: 0.22;
            font-size: 0.82rem;
            font-weight: 900;
        }

        [data-bs-theme="dark"] .pf67-timeline-watermark,
        [data-bs-theme="dark"] .pf67-step-context-watermark {
            opacity: 0.30;
        }

        .fc-event,
        .fc-event-main,
        .fc-event-title,
        .fc-event-time {
            color: #ffffff !important;
            font-weight: 650;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        }

        .fc-daygrid-event {
            border-width: 1px !important;
            border-left-width: 5px !important;
        }

        .fc-event.pf67-job-color-1 {
            background-color: rgba(13, 110, 253, 0.92) !important;
            border-color: rgba(13, 110, 253, 0.98) !important;
        }

        .fc-event.pf67-job-color-2 {
            background-color: rgba(111, 66, 193, 0.92) !important;
            border-color: rgba(111, 66, 193, 0.98) !important;
        }

        .fc-event.pf67-job-color-3 {
            background-color: rgba(214, 51, 132, 0.92) !important;
            border-color: rgba(214, 51, 132, 0.98) !important;
        }

        .fc-event.pf67-job-color-4 {
            background-color: rgba(253, 126, 20, 0.94) !important;
            border-color: rgba(253, 126, 20, 1) !important;
        }

        .fc-event.pf67-job-color-5 {
            background-color: rgba(32, 201, 151, 0.90) !important;
            border-color: rgba(32, 201, 151, 1) !important;
        }

        .fc-event.pf67-job-color-6 {
            background-color: rgba(102, 16, 242, 0.92) !important;
            border-color: rgba(102, 16, 242, 0.98) !important;
        }

        .pf67-status-chip {
            display: inline-block;
            padding: 1px 5px;
            margin-right: 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.22);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

    
        .pf67-inline-edit-buttons {
            display: inline-flex;
            gap: 4px;
            vertical-align: middle;
        }

        .pf67-inline-edit-button {
            width: 34px;
            height: 34px;
            padding: 0;
            line-height: 1;
            text-align: center;
            font-weight: 800;
            border-radius: 6px;
        }

        .pf67-inline-date-editor,
        .pf67-inline-text-editor {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pf67-inline-date-editor input[type="datetime-local"] {
            width: 210px;
            max-width: 60vw;
        }

        .pf67-inline-text-editor input[type="text"] {
            width: min(520px, 70vw);
        }

        .pf67-timeline-watermark,
        .pf67-step-context-watermark {
            opacity: 0.22;
            font-size: 0.82rem;
            font-weight: 900;
        }

        [data-bs-theme="dark"] .pf67-timeline-watermark,
        [data-bs-theme="dark"] .pf67-step-context-watermark {
            opacity: 0.30;
        }

        select option {
            background-color: #ffffff;
            color: #212529;
        }

        [data-bs-theme="dark"] select,
        [data-bs-theme="dark"] select option,
        [data-bs-theme="dark"] .form-select,
        [data-bs-theme="dark"] .pf67-inline-select {
            background-color: #212529;
            color: #f8f9fa;
        }

        [data-bs-theme="dark"] select option:checked {
            background-color: #495057;
            color: #ffffff;
        }

        .fc-event,
        .fc-event-main,
        .fc-event-title,
        .fc-event-time {
            color: #ffffff !important;
            font-weight: 650;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.60);
        }

        .fc-daygrid-event {
            border-width: 1px !important;
            border-left-width: 5px !important;
        }

        .fc-event.pf67-job-color-1 {
            background-color: rgba(13, 110, 253, 0.92) !important;
            border-color: rgba(13, 110, 253, 0.98) !important;
        }

        .fc-event.pf67-job-color-2 {
            background-color: rgba(111, 66, 193, 0.92) !important;
            border-color: rgba(111, 66, 193, 0.98) !important;
        }

        .fc-event.pf67-job-color-3 {
            background-color: rgba(214, 51, 132, 0.92) !important;
            border-color: rgba(214, 51, 132, 0.98) !important;
        }

        .fc-event.pf67-job-color-4 {
            background-color: rgba(253, 126, 20, 0.94) !important;
            border-color: rgba(253, 126, 20, 1) !important;
        }

        .fc-event.pf67-job-color-5 {
            background-color: rgba(32, 201, 151, 0.90) !important;
            border-color: rgba(32, 201, 151, 1) !important;
        }

        .fc-event.pf67-job-color-6 {
            background-color: rgba(102, 16, 242, 0.92) !important;
            border-color: rgba(102, 16, 242, 0.98) !important;
        }

        .pf67-status-chip {
            display: inline-block;
            padding: 1px 5px;
            margin-right: 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.22);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .pf67-timing-table {
            max-width: 720px;
        }

        .pf67-timing-table th,
        .pf67-timing-table td {
            vertical-align: middle;
        }

        .pf67-timing-table input[type="number"] {
            max-width: 120px;
        }

        .pf67-timing-table select {
            max-width: 150px;
        }

    
        :root {
            --pf67-page-surface: #eef0f3;
            --pf67-card-surface: #ffffff;
            --pf67-list-surface: #f8f9fb;
            --pf67-inner-surface: #f2f4f7;
        }

        [data-bs-theme="dark"] {
            --pf67-page-surface: #17191d;
            --pf67-card-surface: #20242a;
            --pf67-list-surface: #252a31;
            --pf67-inner-surface: #2b3038;
        }

        body {
            background: var(--pf67-page-surface);
        }

        .card {
            background: var(--pf67-card-surface);
            border-color: var(--bs-border-color);
        }

        .list-group-item {
            background: var(--pf67-list-surface);
            border-color: var(--bs-border-color);
        }

        .list-group-item:hover {
            background: var(--pf67-inner-surface);
        }

        .pf67-dashboard-list .card-body,
        .pf67-board-column .card-body {
            background: var(--pf67-card-surface);
            border-radius: var(--bs-card-border-radius);
        }

        .pf67-work-section {
            background: var(--pf67-inner-surface);
            border: 1px solid var(--bs-border-color);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .pf67-work-section h3 {
            margin-bottom: 8px;
        }

        .pf67-soft-panel {
            background: var(--pf67-inner-surface);
            border: 1px solid var(--bs-border-color);
            border-radius: 10px;
            padding: 10px;
        }

    
        .fc {
            background: var(--pf67-card-surface);
            border: 1px solid var(--bs-border-color);
            border-radius: 12px;
            padding: 10px;
        }

        .fc .fc-scrollgrid,
        .fc .fc-daygrid-day,
        .fc .fc-timegrid-slot,
        .fc .fc-list {
            background: var(--pf67-list-surface);
        }

        .fc .fc-daygrid-day-frame {
            background: rgba(255, 255, 255, 0.035);
        }

        [data-bs-theme="light"] .fc .fc-daygrid-day-frame {
            background: rgba(255, 255, 255, 0.60);
        }

        .fc .fc-day-today {
            background: rgba(255, 193, 7, 0.16) !important;
        }

        .pf67-calendar-job-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .pf67-calendar-job-label {
            flex: 1;
            min-width: 0;
        }

        .pf67-show-only-button {
            padding: 0 5px;
            line-height: 1.2;
            font-size: 0.72rem;
        }

        .pf67-context-menu {
            position: fixed;
            z-index: 2500;
            display: none;
            min-width: 150px;
            background: var(--bs-body-bg);
            color: var(--bs-body-color);
            border: 1px solid var(--bs-border-color);
            border-radius: 8px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
            padding: 4px;
        }

        .pf67-context-menu button {
            display: block;
            width: 100%;
            border: 0;
            background: transparent;
            color: var(--bs-body-color);
            text-align: left;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .pf67-context-menu button:hover {
            background: rgba(108, 117, 125, 0.18);
        }
.pf67-job-danger-action {
            white-space: nowrap;
        }

        .pf67-context-menu hr {
            margin: 4px 0;
        }

    
        .pf67-context-enabled {
            position: relative;
            box-shadow: inset 3px 0 0 rgba(25, 135, 84, 0.42);
            transition: box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .pf67-context-enabled:hover {
            box-shadow:
                inset 3px 0 0 rgba(25, 135, 84, 0.82),
                0 0 0 2px rgba(25, 135, 84, 0.14);
            background-color: rgba(25, 135, 84, 0.045);
        }

        [data-bs-theme="dark"] .pf67-context-enabled {
            box-shadow: inset 3px 0 0 rgba(75, 210, 130, 0.42);
        }

<script>
document.addEventListener("DOMContentLoaded", function pf67Patch009EPublicNavCleanup() {
    if (!window.location.pathname || window.location.pathname.indexOf("/public") !== 0) {
        return;
    }

    var navLinks = Array.prototype.slice.call(document.querySelectorAll("nav a, .navbar a, header a"));

    function nearestNavItem(link) {
        return link.closest("li") || link.closest(".nav-item") || link;
    }

    navLinks.forEach(function(link) {
        var label = (link.textContent || "").trim().toLowerCase();

        if (label === "history" || label.indexOf("history") === 0) {
            var item = nearestNavItem(link);
            if (item && item.parentNode) {
                item.parentNode.removeChild(item);
            }
            return;
        }

        if (label === "dashboard") {
            link.setAttribute("href", "/public");
        }

        if (label === "flows") {
            link.setAttribute("href", "/public/flows");
        }
    });

    var nav = document.querySelector("nav ul, .navbar-nav, nav");
    var hasProtocols = Array.prototype.slice.call(document.querySelectorAll("nav a, .navbar a, header a")).some(function(link) {
        return (link.textContent || "").trim().toLowerCase() === "protocols";
    });

    if (nav && !hasProtocols) {
        var sampleLi = nav.querySelector("li");
        var a = document.createElement("a");
        a.href = "/public/protocols";
        a.textContent = "Protocols";

        if (sampleLi) {
            var li = document.createElement("li");
            li.className = sampleLi.className;
            a.className = (sampleLi.querySelector("a") || {}).className || "";
            li.appendChild(a);
            nav.appendChild(li);
        } else {
            a.className = "nav-link";
            nav.appendChild(a);
        }
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function pf67Patch009FPublicNavCleanup() {
    if (!window.location.pathname || window.location.pathname.indexOf("/public") !== 0) {
        return;
    }

    function textOf(node) {
        return (node.textContent || "").replace(/\s+/g, " ").trim();
    }

    function navContainer(link) {
        return link.closest("li") || link.closest(".nav-item") || link.closest(".dropdown") || link;
    }

    var allNavLinks = Array.prototype.slice.call(document.querySelectorAll("nav a, .navbar a, header a"));
    var removeWords = ["history", "archive", "activity", "dev", "api"];

    allNavLinks.forEach(function(link) {
        var label = textOf(link).toLowerCase();

        if (removeWords.some(function(word) { return label === word || label.indexOf(word + " ") === 0; })) {
            var item = navContainer(link);
            if (item && item.parentNode) {
                item.parentNode.removeChild(item);
            }
            return;
        }

        if (label === "dashboard") {
            link.setAttribute("href", "/public");
        }

        if (label === "flows") {
            link.setAttribute("href", "/public/flows");
        }

        if (label === "protocols") {
            link.setAttribute("href", "/public/protocols");
        }
    });

    Array.prototype.slice.call(document.querySelectorAll(".dropdown-menu, .dropdown")).forEach(function(menu) {
        var label = textOf(menu).toLowerCase();
        if (removeWords.some(function(word) { return label.indexOf(word) !== -1; })) {
            var item = menu.closest("li") || menu.closest(".nav-item") || menu;
            if (item && item.parentNode) {
                item.parentNode.removeChild(item);
            }
        }
    });

    var nav = document.querySelector("nav ul, .navbar-nav, nav");
    if (!nav) {
        return;
    }

    function hasNav(label) {
        return Array.prototype.slice.call(document.querySelectorAll("nav a, .navbar a, header a")).some(function(link) {
            return textOf(link).toLowerCase() === label.toLowerCase();
        });
    }

    function addNav(label, href) {
        if (hasNav(label)) {
            return;
        }

        var sampleLi = nav.querySelector("li");
        var a = document.createElement("a");
        a.href = href;
        a.textContent = label;

        if (sampleLi) {
            var li = document.createElement("li");
            li.className = sampleLi.className;
            var sampleA = sampleLi.querySelector("a");
            a.className = sampleA ? sampleA.className : "nav-link";
            li.appendChild(a);
            nav.appendChild(li);
        } else {
            a.className = "nav-link";
            nav.appendChild(a);
        }
    }

    addNav("Protocols", "/public/protocols");
    addNav("Flows", "/public/flows");
});

            document.querySelector("nav") ||

        );
    }

    function addNavItem(nav, label, href, itemClass, linkClass, useLi) {
        var a = document.createElement("a");

document.addEventListener("DOMContentLoaded", function pf67Patch009QPublicReturn() {
    var canEdit = {{ 'true' if can_edit else 'false' }};

    if (canEdit) {
        return;
    }

    function isPublicContext() {
        return true;
    }

    function storeReturnPoint() {
        if (!isPublicContext()) {
            return;
        }

        try {
            sessionStorage.setItem("pf67PublicReturn", JSON.stringify({
                url: window.location.pathname + window.location.search,
                scrollY: window.scrollY || 0
            }));
        } catch (err) {
            // Ignore private browsing/sessionStorage failures.
        }
    }

    Array.prototype.slice.call(document.querySelectorAll("a[data-pf67-public-return-source]")).forEach(function(link) {
        link.addEventListener("click", storeReturnPoint);
    });

    Array.prototype.slice.call(document.querySelectorAll("[data-pf67-public-back]")).forEach(function(button) {
        button.addEventListener("click", function(event) {
            event.preventDefault();

            var fallback = button.getAttribute("href") || "{{ url_for('views.index') }}";

            try {
                var stored = JSON.parse(sessionStorage.getItem("pf67PublicReturn") || "{}");

                if (stored && stored.url) {
                    sessionStorage.setItem("pf67PublicRestoreScroll", String(stored.scrollY || 0));
                    window.location.href = stored.url;
                    return;
                }
            } catch (err) {
                // Fall through to fallback.
            }

            if (window.history.length > 1) {
                window.history.back();
                return;
            }

            window.location.href = fallback;
        });
    });

    try {
        var restore = sessionStorage.getItem("pf67PublicRestoreScroll");

        if (restore !== null) {
            sessionStorage.removeItem("pf67PublicRestoreScroll");
            var y = parseInt(restore, 10);

            if (!Number.isNaN(y)) {
                window.setTimeout(function() {
                    window.scrollTo(0, y);
                }, 60);
            }
        }
    } catch (err) {
        // Ignore private browsing/sessionStorage failures.
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function pf67Patch009UProtocolHeaderRuntimeAlignment() {
    var canEdit = {{ 'true' if can_edit else 'false' }};
    var path = window.location.pathname || "";
    var looksLikeProtocolDetail = (
        path.indexOf("/templates/") !== -1 ||
        path.indexOf("/protocol") !== -1 ||
        document.querySelector(".pf67-protocol-toc") ||
        document.querySelector(".pf67-protocol-document") ||
        document.querySelector("[data-pf67-panel-open]")
    );

    if (!looksLikeProtocolDetail) {
        return;
    }

    document.body.classList.add("pf67-protocol-detail-page");

    function rectIsUseful(rect) {
        return rect && rect.width > 120 && rect.height > 20;
    }

    function findMainHeading() {
        var headings = Array.prototype.slice.call(document.querySelectorAll("h1, h2"));

        return headings.find(function(heading) {
            var text = (heading.textContent || "").trim();

            if (!text) {
                return false;
            }

            if (text.toLowerCase() === "dashboard" || text.toLowerCase() === "protocols" || text.toLowerCase() === "flows") {
                return false;
            }

            return true;
        }) || null;
    }

    function findHeaderTarget(heading) {
        if (!heading) {
            return null;
        }

        var current = heading;
        var best = heading;
        var maxClimb = 6;

        while (current && current.parentElement && maxClimb > 0) {
            var parent = current.parentElement;
            var parentText = (parent.textContent || "").replace(/\s+/g, " ").trim();
            var rect = parent.getBoundingClientRect();

            if (
                rectIsUseful(rect) &&
                parentText.length > 20 &&
                parentText.length < 6000 &&
                !parent.matches("body, html, main") &&
                !parent.classList.contains("container") &&
                !parent.classList.contains("container-fluid")
            ) {
                best = parent;
            }

            current = parent;
            maxClimb -= 1;
        }

        return best;
    }

    function findDocumentBounds() {
        var candidates = Array.prototype.slice.call(document.querySelectorAll(
            ".pf67-protocol-toc, .pf67-template-toc, .pf67-toc, [class*='toc'], " +
            ".pf67-protocol-document, .pf67-template-document, .pf67-protocol-steps, .pf67-step-list, " +
            "[class*='step'], [class*='Step']"
        ));

        var useful = candidates
            .map(function(node) {
                return {
                    node: node,
                    rect: node.getBoundingClientRect()
                };
            })
            .filter(function(item) {
                var rect = item.rect;
                var text = (item.node.textContent || "").trim();

                return (
                    rectIsUseful(rect) &&
                    rect.top > 120 &&
                    text.length > 15 &&
                    rect.width < window.innerWidth - 20
                );
            });

        if (!useful.length) {
            return null;
        }

        var minLeft = Math.min.apply(null, useful.map(function(item) { return item.rect.left; }));
        var maxRight = Math.max.apply(null, useful.map(function(item) { return item.rect.right; }));

        if (maxRight - minLeft < 300) {
            return null;
        }

        return {
            left: minLeft,
            right: maxRight,
            width: maxRight - minLeft
        };
    }

    function alignHeader() {
        var heading = findMainHeading();
        var target = findHeaderTarget(heading);
        var bounds = findDocumentBounds();

        if (!heading || !target || !bounds) {
            return;
        }

        var parent = target.parentElement || document.body;
        var parentRect = parent.getBoundingClientRect();

        if (!rectIsUseful(parentRect)) {
            return;
        }

        var leftInParent = bounds.left - parentRect.left;

        target.setAttribute("data-pf67-header-align-target", "true");
        target.style.setProperty("width", bounds.width + "px", "important");
        target.style.setProperty("max-width", bounds.width + "px", "important");
        target.style.setProperty("margin-left", leftInParent + "px", "important");
        target.style.setProperty("margin-right", "0", "important");
        target.style.setProperty("text-align", "left", "important");

        Array.prototype.slice.call(target.querySelectorAll("img")).forEach(function(img) {
            img.style.setProperty("max-width", "100%", "important");
            img.style.setProperty("height", "auto", "important");
        });
    }

    // Run after images/layout settle, then again on resize.
    alignHeader();
    window.setTimeout(alignHeader, 120);
    window.setTimeout(alignHeader, 400);

    var resizeTimer = null;

    window.addEventListener("resize", function() {
        if (resizeTimer) {
            window.clearTimeout(resizeTimer);
        }

        resizeTimer = window.setTimeout(alignHeader, 120);
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function pf67Patch010C9RestoreProcedureControlRowDetection() {
    var canEdit = {{ 'true' if can_edit else 'false' }};
    var path = window.location.pathname || "";
    var templateMatch = path.match(/\/templates\/(\d+)/);

    if (canEdit) {
        document.body.classList.add("pf67-can-edit");
    }

    function textOf(node) {
        return (node.textContent || "").replace(/\s+/g, " ").trim();
    }

    function isAddStep(node) {
        var text = textOf(node).toLowerCase();
        return text === "add step" || text === "add step here";
    }

    function isInsertProcedure(node) {
        return textOf(node).toLowerCase() === "insert procedure";
    }

    function isMoveControl(node) {
        var text = textOf(node).toLowerCase();
        var raw = "";

        if (node.getAttribute) {
            raw = (node.getAttribute("href") || "") + " " + (node.getAttribute("action") || "") + " " + (node.getAttribute("name") || "") + " " + (node.className || "");
        }

        raw = String(raw).toLowerCase();

        return (
            text.indexOf("move up") !== -1 ||
            text.indexOf("move down") !== -1 ||
            text === "↑" ||
            text === "↓" ||
            raw.indexOf("move") !== -1 ||
            raw.indexOf("reorder") !== -1
        );
    }

    function normalizeAddStepLabels() {
        Array.prototype.slice.call(document.querySelectorAll("a, button")).forEach(function(node) {
            if (textOf(node).toLowerCase() === "add step here") {
                node.textContent = "Add Step";
            }
        });
    }

    function addInsertProcedurePeers() {
        if (!canEdit || !templateMatch) {
            return;
        }

        var href = "/protocols/" + templateMatch[1] + "/insert-procedure-patch010b9";

        Array.prototype.slice.call(document.querySelectorAll("a, button")).filter(isAddStep).forEach(function(addStep) {
            var parent = addStep.parentElement || addStep;
            var existing = Array.prototype.slice.call(parent.querySelectorAll("a, button")).find(isInsertProcedure);

            if (!existing) {
                existing = document.createElement("a");
                existing.textContent = "Insert Procedure";
                existing.href = href;
                addStep.insertAdjacentElement("beforebegin", existing);
            }

            if (existing.tagName.toLowerCase() === "a") {
                existing.setAttribute("href", href);
            }

            existing.className = addStep.className;
            existing.style.marginLeft = "";
            existing.style.marginRight = "";
            existing.setAttribute("data-pf67-insert-procedure-peer", "true");

            parent.classList.add("pf67-normalized-action-pair");

            if (existing.nextElementSibling !== addStep) {
                parent.insertBefore(existing, addStep);
            }
        });
    }

    function syncInsertProcedureVisibility() {
        Array.prototype.slice.call(document.querySelectorAll("[data-pf67-insert-procedure-peer]")).forEach(function(insertLink) {
            var parent = insertLink.parentElement;

            if (!parent) {
                return;
            }

            var addStep = Array.prototype.slice.call(parent.querySelectorAll("a, button")).find(function(node) {
                return node !== insertLink && isAddStep(node);
            });

            if (!addStep) {
                return;
            }

            var style = window.getComputedStyle(addStep);
            insertLink.style.display = style.display;
            insertLink.style.visibility = style.visibility;
            insertLink.style.opacity = style.opacity;
            insertLink.style.pointerEvents = style.pointerEvents;
        });
    }

    function markerForSurface(surface) {
        return surface.querySelector(".pf67-procedure-reference-marker");
    }

    function referenceIdFromMarker(surface) {
        var marker = markerForSurface(surface);

        if (marker) {
            return marker.getAttribute("data-pf67-reference-step-id") || "";
        }

        return "";
    }

    function procedureIdFromMarker(surface) {
        var marker = markerForSurface(surface);

        if (marker) {
            return marker.getAttribute("data-pf67-procedure-template-id") || "";
        }

        return "";
    }

    function extractLastNumber(value) {
        var nums = String(value || "").match(/\d+/g);

        if (!nums || !nums.length) {
            return "";
        }

        return nums[nums.length - 1];
    }

    function referenceIdFallback(surface) {
        var fromData = surface.getAttribute("data-pf67-reference-step-id");

        if (fromData) {
            return fromData;
        }

        var found = "";

        Array.prototype.slice.call(surface.querySelectorAll("a[href], form[action], button")).some(function(node) {
            if (isMoveControl(node)) {
                return false;
            }

            var value = "";

            if (node.getAttribute) {
                value = (node.getAttribute("href") || "") + " " + (node.getAttribute("action") || "") + " " + (node.getAttribute("data-step-id") || "");
            }

            found = extractLastNumber(value);

            return Boolean(found);
        });

        if (found) {
            surface.setAttribute("data-pf67-reference-step-id", found);
        }

        return found;
    }

    function procedureIdFallback(surface) {
        var found = "";

        Array.prototype.slice.call(surface.querySelectorAll("a[href]")).some(function(link) {
            var href = link.getAttribute("href") || "";

            if (href.indexOf("/templates/") === -1) {
                return false;
            }

            found = extractLastNumber(href);

            return Boolean(found);
        });

        return found;
    }

    function referenceIdForSurface(surface) {
        return referenceIdFromMarker(surface) || referenceIdFallback(surface);
    }

    function procedureIdForSurface(surface) {
        return procedureIdFromMarker(surface) || procedureIdFallback(surface);
    }

    function groupByReferenceId() {
        var surfaces = Array.prototype.slice.call(document.querySelectorAll(".pf67-procedure-derived-step-surface"));
        var map = {};
        var order = [];
        var fallbackGroups = [];
        var currentFallback = [];

        surfaces.forEach(function(surface) {
            var refId = referenceIdForSurface(surface);

            if (refId) {
                if (!map[refId]) {
                    map[refId] = [];
                    order.push(refId);
                }

                map[refId].push(surface);

                if (currentFallback.length) {
                    fallbackGroups.push(currentFallback);
                    currentFallback = [];
                }

                return;
            }

            /*
              Last-resort fallback: group contiguous derived surfaces. This can show
              Open/Edit Procedure only if a Procedure template link is detectable, but it
              avoids losing all controls when the marker is unavailable.
            */
            if (!currentFallback.length) {
                currentFallback.push(surface);
                return;
            }

            var prev = currentFallback[currentFallback.length - 1];
            var walker = prev.nextElementSibling;
            var adjacent = false;

            while (walker) {
                if (walker === surface) {
                    adjacent = true;
                    break;
                }

                if (walker.classList && walker.classList.contains("pf67-procedure-reference-control-row")) {
                    break;
                }

                var text = textOf(walker).toLowerCase();
                var onlyControls = text === "" || text.indexOf("add step") !== -1 || text.indexOf("insert procedure") !== -1;

                if (!onlyControls) {
                    break;
                }

                walker = walker.nextElementSibling;
            }

            if (adjacent) {
                currentFallback.push(surface);
            } else {
                fallbackGroups.push(currentFallback);
                currentFallback = [surface];
            }
        });

        if (currentFallback.length) {
            fallbackGroups.push(currentFallback);
        }

        var groups = order.map(function(refId) {
            return {
                refId: refId,
                surfaces: map[refId]
            };
        });

        fallbackGroups.forEach(function(group, index) {
            var refId = referenceIdForSurface(group[0]) || "";

            if (refId) {
                groups.push({
                    refId: refId,
                    surfaces: group
                });
            }
        });

        return groups;
    }

    function createProcedureControlRow(group) {
        if (!templateMatch || !group.refId) {
            return null;
        }

        var first = group.surfaces[0];
        var procedureId = procedureIdForSurface(first);
        var returnTo = encodeURIComponent(window.location.pathname + window.location.search);
        var row = document.createElement("div");
        row.className = "pf67-procedure-reference-control-row";
        row.setAttribute("data-pf67-procedure-reference-row", group.refId);

        var label = document.createElement("span");
        label.className = "pf67-procedure-reference-label";
        label.textContent = "Procedure";
        row.appendChild(label);

        var timing = document.createElement("button");
        timing.className = "btn btn-outline-secondary btn-sm";
        timing.type = "button";
        timing.setAttribute("data-pf67-inline-timing-trigger", "true");
        timing.setAttribute("data-pf67-reference-step-id", group.refId);
        timing.textContent = "Timing Window";
        row.appendChild(timing);

        if (procedureId) {
            var edit = document.createElement("a");
            edit.className = "btn btn-outline-secondary btn-sm";
            edit.href = "/templates/" + procedureId + "?return_to=" + returnTo;
            edit.textContent = "Open/Edit Procedure";
            row.appendChild(edit);
        }

        var up = document.createElement("a");
        up.className = "btn btn-outline-secondary btn-sm";
        up.href = "/protocols/" + templateMatch[1] + "/procedure-reference/" + group.refId + "/move-up-c7";
        up.textContent = "Move Up";
        row.appendChild(up);

        var down = document.createElement("a");
        down.className = "btn btn-outline-secondary btn-sm";
        down.href = "/protocols/" + templateMatch[1] + "/procedure-reference/" + group.refId + "/move-down-c7";
        down.textContent = "Move Down";
        row.appendChild(down);

        return row;
    }

    function installProcedureControlRows() {
        if (!canEdit || !templateMatch) {
            return;
        }

        groupByReferenceId().forEach(function(group) {
            if (!group.refId) {
                return;
            }

            if (document.querySelector('[data-pf67-procedure-reference-row="' + group.refId + '"]')) {
                return;
            }

            var row = createProcedureControlRow(group);

            if (!row || !group.surfaces.length) {
                return;
            }

            group.surfaces[0].insertAdjacentElement("beforebegin", row);
        });
    }

    function buildTimingField(field) {
        var wrap = document.createElement("label");
        wrap.className = "pf67-procedure-inline-timing-field";

        var label = document.createElement("span");
        label.textContent = field.label;
        wrap.appendChild(label);

        var input = document.createElement("input");
        input.className = "form-control form-control-sm";
        input.type = "number";
        input.min = "0";
        input.step = "1";
        input.value = field.value === null || field.value === undefined ? "" : String(field.value);
        input.setAttribute("data-column", field.column);
        input.setAttribute("data-key", field.key);
        wrap.appendChild(input);

        var select = document.createElement("select");
        select.className = "form-select form-select-sm";
        select.setAttribute("data-unit-for", field.column);

        ["minutes", "hours", "days"].forEach(function(unit) {
            var option = document.createElement("option");
            option.value = unit;
            option.textContent = unit.charAt(0).toUpperCase() + unit.slice(1);

            if (field.unit === unit) {
                option.selected = true;
            }

            select.appendChild(option);
        });

        wrap.appendChild(select);
        return wrap;
    }

    function openInlineTimingEditor(row, stepId) {
        if (!templateMatch || !stepId) {
            return;
        }

        var existing = row.querySelector(".pf67-procedure-inline-timing-editor");

        if (existing) {
            existing.remove();
            row.classList.remove("is-editing");
            return;
        }

        row.classList.add("is-editing");

        var panel = document.createElement("div");
        panel.className = "pf67-procedure-inline-timing-editor";
        panel.innerHTML = "<h4>Timing Window</h4><div class='text-muted small mb-2'>Loading...</div>";
        row.appendChild(panel);

        fetch("/protocols/" + templateMatch[1] + "/procedure-reference/" + stepId + "/timing-inline-c8")
            .then(function(response) { return response.ok ? response.json() : Promise.reject(response); })
            .then(function(data) {
                if (!data || !data.ok) {
                    throw new Error((data && data.error) || "Unable to load timing.");
                }

                panel.innerHTML = "";

                var title = document.createElement("h4");
                title.textContent = "Timing Window";

                if (data.procedure_name) {
                    title.textContent = "Timing Window - " + data.procedure_name;
                }

                panel.appendChild(title);

                var grid = document.createElement("div");
                grid.className = "pf67-procedure-inline-timing-grid";
                panel.appendChild(grid);

                if (!data.fields || !data.fields.length) {
                    var empty = document.createElement("div");
                    empty.className = "text-muted small";
                    empty.textContent = "No timing fields are available for this Procedure reference.";
                    grid.appendChild(empty);
                } else {
                    data.fields.forEach(function(field) {
                        grid.appendChild(buildTimingField(field));
                    });
                }

                var actions = document.createElement("div");
                actions.className = "pf67-procedure-inline-timing-actions";

                var save = document.createElement("button");
                save.className = "btn btn-primary btn-sm";
                save.type = "button";
                save.textContent = "Save Timing";

                var close = document.createElement("button");
                close.className = "btn btn-outline-secondary btn-sm";
                close.type = "button";
                close.textContent = "Close";

                actions.appendChild(save);
                actions.appendChild(close);
                panel.appendChild(actions);

                close.addEventListener("click", function() {
                    panel.remove();
                    row.classList.remove("is-editing");
                });

                save.addEventListener("click", function() {
                    var fields = Array.prototype.slice.call(panel.querySelectorAll("input[data-column]")).map(function(input) {
                        var column = input.getAttribute("data-column");
                        var select = panel.querySelector("select[data-unit-for='" + column + "']");

                        return {
                            column: column,
                            key: input.getAttribute("data-key") || "",
                            value: input.value,
                            unit: select ? select.value : "minutes"
                        };
                    });

                    save.disabled = true;
                    save.textContent = "Saving...";

                    fetch("/protocols/" + templateMatch[1] + "/procedure-reference/" + stepId + "/timing-inline-c8", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ fields: fields })
                    })
                        .then(function(response) { return response.ok ? response.json() : Promise.reject(response); })
                        .then(function(saved) {
                            if (!saved || !saved.ok) {
                                throw new Error((saved && saved.error) || "Unable to save timing.");
                            }

                            save.textContent = "Saved";
                            window.setTimeout(function() {
                                panel.remove();
                                row.classList.remove("is-editing");
                            }, 450);
                        })
                        .catch(function() {
                            save.disabled = false;
                            save.textContent = "Save Timing";
                            alert("Unable to save timing. Please try again.");
                        });
                });
            })
            .catch(function() {
                panel.innerHTML = "<h4>Timing Window</h4><div class='text-muted'>Unable to load timing editor.</div>";
            });
    }

    function attachInlineTimingHandlers() {
        Array.prototype.slice.call(document.querySelectorAll("[data-pf67-inline-timing-trigger]")).forEach(function(button) {
            if (button.getAttribute("data-pf67-timing-bound") === "true") {
                return;
            }

            button.setAttribute("data-pf67-timing-bound", "true");

            button.addEventListener("click", function(event) {
                event.preventDefault();
                event.stopPropagation();

                var row = button.closest(".pf67-procedure-reference-control-row");
                var stepId = button.getAttribute("data-pf67-reference-step-id");

                if (row && stepId) {
                    openInlineTimingEditor(row, stepId);
                }
            });
        });
    }

    function hideObscureProcedureLinks() {
        Array.prototype.slice.call(document.querySelectorAll(".pf67-procedure-derived-step-surface")).forEach(function(surface) {
            Array.prototype.slice.call(surface.querySelectorAll("a, button, form")).forEach(function(ctrl) {
                ctrl.classList.add("pf67-hidden-obscure-procedure-link");
                ctrl.setAttribute("data-pf67-derived-control-hidden", "true");
            });

            var next = surface.nextElementSibling;
            var scanned = 0;

            while (next && scanned < 4) {
                if (next.classList && next.classList.contains("pf67-procedure-derived-step-surface")) {
                    break;
                }

                if (next.classList && next.classList.contains("pf67-procedure-reference-control-row")) {
                    break;
                }

                var text = textOf(next).toLowerCase();
                var hasTinyOrProcedureLink = (
                    text.length <= 2 ||
                    (next.querySelector && next.querySelector("a[href*='procedure-reference'], a[href*='steps'], a[href*='step']"))
                );

                var hasValidAddInsert = text.indexOf("add step") !== -1 || text.indexOf("insert procedure") !== -1;

                if (hasTinyOrProcedureLink && !hasValidAddInsert) {
                    next.classList.add("pf67-hidden-obscure-procedure-link");
                }

                next = next.nextElementSibling;
                scanned += 1;
            }
        });
    }

    function disableProcedureDerivedSurfaceClicks() {
        Array.prototype.slice.call(document.querySelectorAll(".pf67-procedure-derived-step-surface")).forEach(function(surface) {
            if (surface.getAttribute("data-pf67-click-disabled") === "true") {
                return;
            }

            surface.setAttribute("data-pf67-click-disabled", "true");

            surface.addEventListener("click", function(event) {
                if (event.target.closest("input, textarea, select")) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();
            }, true);
        });
    }

    function hideFirstStepTimingIfNeeded() {
        var pathLower = (window.location.pathname || "").toLowerCase();

        if (pathLower.indexOf("step") === -1) {
            return;
        }

        var nums = (window.location.pathname || "").match(/\d+/g) || [];
        var stepId = nums.length ? nums[nums.length - 1] : "";
        var templateId = "";

        var match = (window.location.pathname || "").match(/\/templates\/(\d+)/);

        if (match) {
            templateId = match[1];
        } else if (nums.length) {
            templateId = nums[0];
        }

        var url = "/pf67/patch010c7/step-context?step_id=" + encodeURIComponent(stepId) + "&template_id=" + encodeURIComponent(templateId);

        fetch(url)
            .then(function(response) { return response.ok ? response.json() : null; })
            .then(function(data) {
                if (!data || !data.hide_timing) {
                    return;
                }

                var timingWords = [
                    "timing before this step",
                    "ideal is the required wait",
                    "ideal",
                    "check",
                    "limit",
                    "risk",
                    "failure",
                    "minimum",
                    "maximum",
                    "wait minutes",
                    "duration minutes"
                ];

                Array.prototype.slice.call(document.querySelectorAll("label, legend, h2, h3, h4, h5, .form-label, .form-group, .mb-3, .row, fieldset, section")).forEach(function(node) {
                    var txt = textOf(node).toLowerCase();

                    if (!txt) {
                        return;
                    }

                    var matched = timingWords.some(function(word) {
                        return txt.indexOf(word) !== -1;
                    });

                    if (!matched) {
                        return;
                    }

                    var hasTimingInput = Boolean(node.querySelector && node.querySelector("input[name*='ideal'], input[name*='check'], input[name*='limit'], input[name*='risk'], input[name*='failure'], input[name*='wait'], input[name*='duration'], input[name*='minimum'], input[name*='maximum']"));

                    if (hasTimingInput || txt.indexOf("timing before this step") !== -1 || txt.indexOf("ideal is the required wait") !== -1) {
                        node.classList.add("pf67-hide-first-step-timing");
                    }
                });
            })
            .catch(function() {});
    }

    function injectReturnBarIfNeeded() {

<script>
document.addEventListener("DOMContentLoaded", function pf67Patch011CD3StableKeywordFilters() {
    var path = window.location.pathname || "";
    var filterTimer = null;

    function textOf(node) {
        return (node && node.textContent ? node.textContent : "").replace(/\s+/g, " ").trim();
    }

    function isActuallyVisible(node) {
        if (!node || !node.getBoundingClientRect) {
            return false;

    }

    function closestCard(link) {
        return link.closest(".pf67-card, .card, .list-group-item, .pf67-protocol-card, .pf67-template-card, .pf67-flow-card, article, .col-md-4, .col-md-6, .col-lg-4, .col-lg-3, .col-xl-4, .col-xl-3") || link.parentElement;
    }

    function uniqueCardsForLinks(selector) {
        var seen = [];
        var cards = [];

        Array.prototype.slice.call(document.querySelectorAll(selector)).forEach(function(link) {
            var card = closestCard(link);

            if (!card || seen.indexOf(card) !== -1) {

    }

    }

    function pageKind() {
        if (document.querySelector(".pf67-keyword-filter-wrap")) {

        }

        if ((path.indexOf("/templates") === 0 || path.indexOf("/protocols") === 0 || bodyText.indexOf("protocols") !== -1 || bodyText.indexOf("procedures") !== -1) && templateCards().length >= 2) {
            return "templates";
        }

        if ((path.indexOf("/jobs") === 0 || path.indexOf("/flows") === 0 || bodyText.indexOf("flows") !== -1) && flowCards().length >= 2) {

    function findProtocolProcedureToggle() {

        var best = null;
        var bestScore = -1;

        candidates.forEach(function(node) {
            var text = textOf(node).toLowerCase();

            if (text.indexOf("protocol") === -1 || text.indexOf("procedure") === -1) {
                return;
            }

            var rect = node.getBoundingClientRect();
            var score = 0;

            if (rect.top < 450) {
                score += 6;
            }

            if (node.querySelector("a, button")) {
                score += 5;
            }

            if (text.length < 180) {

    function findTemplateCategoryFilterAnchor() {
        var candidates = Array.prototype.slice.call(document.querySelectorAll(
            "[data-pf67-category-filter], " +
            ".pf67-category-filter, " +
            ".pf67-protocol-category-filter, " +
            ".pf67-category-strip, " +
            ".pf67-category-buttons, " +
            ".pf67-category-row, " +
            ".pf67-protocol-category-row, " +
            ".pf67-template-category-row, " +
            ".pf67-filter-categories, " +
            "section, div"
        ));

        var best = null;
        var bestScore = -1;

        candidates.forEach(function(node) {
            if (!node || node.classList.contains("pf67-keyword-filter-wrap")) {
                return;
            }

            var text = textOf(node).toLowerCase();
            var className = String(node.className || "").toLowerCase();
            var score = 0;

            if (className.indexOf("category") !== -1) {
                score += 8;
            }

            if (text.indexOf("category") !== -1 || text.indexOf("categories") !== -1) {
                score += 8;
            }

            if (node.querySelector("a, button, input, label")) {
                score += 3;
            }

            var rect = node.getBoundingClientRect ? node.getBoundingClientRect() : { top: 9999 };

            if (rect.top < 650) {
                score += 2;
            }

            if (text.length > 500) {
                score -= 4;
            }

            if (score > bestScore) {
                best = node;
                bestScore = score;
            }
        });

    }

    function insertPoint(kind) {
        if (kind === "templates") {
            var categoryAnchor = findTemplateCategoryFilterAnchor();

            if (categoryAnchor && categoryAnchor.parentElement) {
                return {
                    parent: categoryAnchor.parentElement,
                    before: categoryAnchor
                };
            }

            var toggle = findProtocolProcedureToggle();

            if (toggle && toggle.parentElement) {
                return {
                    parent: toggle.parentElement,
                    after: toggle
                };
            }
        }

        var hero = document.querySelector(".pf67-dashboard-hero");
        if (hero && hero.parentElement) {
            return {
                parent: hero.parentElement,
                after: hero
            };
        }

        var heading = document.querySelector("main h1, main h2, .container h1, .container h2, h1, h2");

        if (heading && heading.parentElement) {
            return {
                parent: heading.parentElement,
                after: heading
            };
        }

        var main = document.querySelector("main") || document.querySelector(".container") || document.body;

        return {
            parent: main,
            after: null
        };
    }

    function activeTemplateRole() {
        var params = new URLSearchParams(window.location.search || "");
        var role = (params.get("role") || params.get("view") || params.get("type") || "").toLowerCase();

        if (role.indexOf("procedure") !== -1) {
            return "procedure";
        }

        if (role.indexOf("protocol") !== -1) {
            return "protocol";
        }

        var active = Array.prototype.slice.call(document.querySelectorAll(".active, [aria-selected='true'], [aria-pressed='true']")).find(function(node) {
            var text = textOf(node).toLowerCase();
            return text.indexOf("protocol") !== -1 || text.indexOf("procedure") !== -1;
        });

        if (active) {
            var activeText = textOf(active).toLowerCase();

            if (activeText.indexOf("procedure") !== -1) {
                return "procedure";
            }

            if (activeText.indexOf("protocol") !== -1) {
                return "protocol";
            }
        }

        return "";
    }

    function cardRole(card) {
        var explicit = (
            card.getAttribute("data-protocol-role") ||
            card.getAttribute("data-role") ||
            card.getAttribute("data-pf67-role") ||
            ""
        ).toLowerCase();

        if (explicit.indexOf("procedure") !== -1) {
            return "procedure";
        }

        if (explicit.indexOf("protocol") !== -1) {
            return "protocol";
        }

        var text = textOf(card).toLowerCase();

        /*
          This is intentionally conservative. Avoid classifying a Protocol card as
          Procedure merely because it mentions a Procedure inside its description.
          Prefer visible view scope, and only use card text when it has obvious pill/label wording.
        */
        if (text.indexOf("procedure ·") !== -1 || text.indexOf("procedure\n") !== -1 || text.indexOf("procedure ") === 0) {
            return "procedure";
        }

        if (text.indexOf("protocol ·") !== -1 || text.indexOf("protocol\n") !== -1 || text.indexOf("protocol ") === 0) {
            return "protocol";
        }

        return "";

    function currentlyVisibleTemplateCards() {
        var cards = templateCards();

    function installKeywordFilter(kind) {

        }

        var wrap = document.createElement("div");
        wrap.className = "pf67-keyword-filter-wrap";
        wrap.setAttribute("data-pf67-filter-kind", kind);

        var input = document.createElement("input");
        input.className = "form-control form-control-sm";
        input.type = "search";
        input.placeholder = kind === "flows" ? "Filter Flows..." : "Filter...";
        input.setAttribute("aria-label", input.placeholder);

        var reset = document.createElement("button");
        reset.className = "btn btn-outline-secondary btn-sm pf67-keyword-filter-reset";
        reset.type = "button";

        var count = document.createElement("span");
        count.className = "pf67-keyword-filter-count";

        if (point.before && point.before.parentElement) {

        } else if (point.after && point.after.nextSibling) {

        } else if (point.after) {
            point.parent.appendChild(wrap);
        } else {
            point.parent.insertBefore(wrap, point.parent.firstChild);
        }

        function applyFilter() {
            var query = input.value.trim().toLowerCase();
            var scopeCards = activeCards(kind);
            var scopeSet = scopeCards;
            var visible = 0;

            allCards(kind).forEach(function(card) {
                if (scopeSet.indexOf(card) === -1) {

                }

        }

        function scheduleFilter() {
            if (filterTimer) {
                window.clearTimeout(filterTimer);

        input.addEventListener("input", applyFilter);

        reset.addEventListener("click", function() {
            input.value = "";
            applyFilter();
            input.focus();
        });

        if (kind === "templates") {
            document.addEventListener("click", function(event) {
                var target = event.target.closest("a, button, label, input");

                if (!target) {
                    return;

                var label = textOf(target).toLowerCase();

            ".pf67-small",

        row.className = "pf67-duration-pill-row";

        if (titleLink && titleLink.parentElement) {
            titleLink.parentElement.insertAdjacentElement("afterend", row);

    function installDurationPills() {

            .then(function(data) {

                    var titleLink = links.find(function(link) {
                        return templateIdFromHref(link.getAttribute("href"));
                    });

                    if (!titleLink) {
                        return;
                    }

                    var templateId = templateIdFromHref(titleLink.getAttribute("href"));
                    var duration = data.durations[templateId];

                    if (!duration || !duration.label) {
                        return;
                    }

                    var pill = document.createElement("span");
                    pill.className = "pf67-duration-pill";
                    pill.textContent = duration.label;
                    pill.setAttribute("title", "Estimated total duration");

                    var row = findDurationRow(card, titleLink);

                    if (!row.classList.contains("pf67-duration-pill-row") && row.className.indexOf("pf67-small") === -1) {
                        var pillRow = document.createElement("div");
                        pillRow.className = "pf67-duration-pill-row";
                        row.appendChild(pillRow);
                        row = pillRow;
                    }

                    row.appendChild(pill);
                });
            })
            .catch(function() {});
    }

    var kind = pageKind();

    if (kind) {
        installKeywordFilter(kind);
    }

    if (kind === "templates") {
        installDurationPills();
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function pf67Patch011CD4DurationPillPlacementFix() {
    function textOf(node) {
        return (node && node.textContent ? node.textContent : "").replace(/\s+/g, " ").trim();
    }

    function closestCard(node) {
        return node.closest(".pf67-card, .card, .list-group-item, .pf67-protocol-card, .pf67-template-card, article, .col-md-4, .col-md-6, .col-lg-4, .col-lg-3, .col-xl-4, .col-xl-3") || node.parentElement;
    }

    function isLikelyPill(node) {
        if (!node || node.nodeType !== 1) {
            return false;
        }

        var className = String(node.className || "").toLowerCase();
        var text = textOf(node).toLowerCase();

        return (
            className.indexOf("pill") !== -1 ||
            className.indexOf("badge") !== -1 ||
            className.indexOf("chip") !== -1 ||
            className.indexOf("tag") !== -1 ||
            text.indexOf("step") !== -1 ||
            text === "protocol" ||
            text === "procedure" ||
            text === "public" ||
            text === "private"
        );
    }

    function childPills(row) {
        return Array.prototype.slice.call(row.children || []).filter(function(child) {
            return isLikelyPill(child);
        });
    }

    function looksLikeStepCount(node) {
        var text = textOf(node).toLowerCase();
        return /\b\d+\s+steps?\b/.test(text) || /\bsteps?\s+\d+\b/.test(text);
    }

    function looksLikeRolePill(node) {
        var text = textOf(node).toLowerCase();
        return text === "protocol" || text === "procedure";
    }

    function looksLikeVisibilityPill(node) {
        var text = textOf(node).toLowerCase();
        return text === "public" || text === "private";
    }

    function scorePillRow(row) {
        var pills = childPills(row);

        if (!pills.length) {
            return -1;
        }

        var score = 0;
        var rowText = textOf(row).toLowerCase();

        if (pills.some(looksLikeStepCount)) {
            score += 10;
        }

        if (pills.some(looksLikeRolePill)) {
            score += 8;
        }

        if (pills.some(looksLikeVisibilityPill)) {
            score += 5;
        }

        if (rowText.indexOf("step") !== -1) {
            score += 4;
        }

        if (rowText.indexOf("protocol") !== -1 || rowText.indexOf("procedure") !== -1) {
            score += 4;
        }

        if (row.className && String(row.className).toLowerCase().indexOf("pill") !== -1) {
            score += 3;
        }

        if (row.className && String(row.className).toLowerCase().indexOf("meta") !== -1) {
            score += 2;
        }

        return score;
    }

    function findExistingPillRow(card) {
        var candidates = Array.prototype.slice.call(card.querySelectorAll(".pf67-card-pills, .pf67-pill-row, .pf67-template-meta, .pf67-card-meta, .pf67-small, .small, .card-body, div, p"));

        var best = null;
        var bestScore = -1;

        candidates.forEach(function(row) {
            if (row.querySelector(".pf67-duration-pill") && !row.querySelector("[class*='step'], [class*='badge'], [class*='pill']")) {
                return;
            }

            var score = scorePillRow(row);

            if (score > bestScore) {
                best = row;
                bestScore = score;
            }
        });

        return bestScore >= 8 ? best : null;
    }

    function moveDurationPill(pill) {
        var card = closestCard(pill);

        if (!card) {
            return false;
        }

        var row = findExistingPillRow(card);

        if (!row) {
            return false;
        }

        var pills = childPills(row).filter(function(child) {
            return child !== pill;
        });

        var stepPill = pills.find(looksLikeStepCount);
        var rolePill = pills.find(looksLikeRolePill);

        pill.classList.add("pf67-duration-pill-inline");

        if (stepPill && stepPill.parentElement === row) {
            stepPill.insertAdjacentElement("afterend", pill);
            return true;
        }

        if (rolePill && rolePill.parentElement === row) {
            row.insertBefore(pill, rolePill);
            return true;
